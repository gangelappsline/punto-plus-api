        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/whatsapp/messages:
    get:
      tags: [Negocio]
      summary: Historial de WhatsApp del negocio
      description: |
        Envíos propios, mensajes entrantes de los clientes y acuses de entrega/lectura.
        Un `admin` ve el historial global y puede filtrar por `business_id`.
      security: [{ OAuth2: [] }]
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [outgoing, incoming] } }
        - { name: status, in: query, schema: { type: string, enum: [queued, sent, delivered, read, received, failed] } }
        - { name: search, in: query, description: Texto, teléfono o nombre de plantilla, schema: { type: string } }
        - { name: business_id, in: query, description: Sólo para `admin`, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Mensajes paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WhatsAppMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Negocio]
      summary: Enviar un mensaje de WhatsApp
      description: |
        - `type: text` → texto libre, sólo válido dentro de la ventana de 24 h desde el último
          mensaje del cliente.
        - `type: template` → plantilla aprobada; obligatoria para iniciar conversación o pasadas
          24 h.

        El teléfono se normaliza a E.164 (`WHATSAPP_DEFAULT_COUNTRY_CODE` completa los números de
        10 dígitos). Si Meta rechaza el envío: `502 whatsapp_error` con `code`/`subcode`; si faltan
        credenciales: `503 whatsapp_not_configured` con `missing`.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, type]
              properties:
                to: { type: string, example: '+5215512345678' }
                type: { type: string, enum: [text, template] }
                body: { type: string, maxLength: 4096, description: Obligatorio con `type=text` }
                preview_url: { type: boolean, default: false }
                template_name: { type: string, example: promo_sellos, description: Obligatorio con `type=template` }
                template_language: { type: string, example: es_MX }
                components:
                  type: array
                  description: Parámetros de la plantilla en el formato de la Cloud API
                  items: { type: object, additionalProperties: true }
                  example:
                    - type: body
                      parameters:
                        - type: text
                          text: Ana
      responses:
        '201':
          description: Mensaje aceptado por Meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WhatsAppMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Meta rechazó el envío
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  error: { type: string, example: whatsapp_error }
                  code: { type: integer, example: 131030 }
                  subcode: { type: integer, nullable: true, example: 2494073 }
                  type: { type: string, example: OAuthException }
        '503':
          description: Integración apagada o sin credenciales
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  error: { type: string, enum: [whatsapp_disabled, whatsapp_not_configured] }
                  missing:
                    type: array
                    items: { type: string }

  /api/business/whatsapp/templates:
    get:
      tags: [Negocio]
      summary: Plantillas de WhatsApp de la cuenta
      description: |
        Plantillas de la WABA con su estado de aprobación (`APPROVED`, `PENDING`, `REJECTED`).
        Es lo que se puede enviar con `type: template`.
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Plantillas de la cuenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WhatsAppTemplate' }
        '502': { description: Error de Meta }
        '503':
          description: Integración apagada o sin credenciales

  /api/webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Handshake del webhook de WhatsApp (Meta)
      description: |
        Meta llama a esta URL al guardar el webhook. Si `hub.mode=subscribe` y
        `hub.verify_token` coincide con `WHATSAPP_WEBHOOK_VERIFY_TOKEN`, se responde
        `hub.challenge` en texto plano.
      security: []
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string, enum: [subscribe] } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Challenge devuelto en texto plano
          content:
            text/plain:
              schema: { type: string }
        '403':
          description: Modo o token de verificación incorrectos
    post:
      tags: [Webhooks]
      summary: Eventos del webhook de WhatsApp (mensajes entrantes y acuses)
      description: |
        Requiere la cabecera `X-Hub-Signature-256` calculada con `WHATSAPP_APP_SECRET`
        (HMAC-SHA256 del cuerpo en crudo). Guarda los mensajes entrantes y actualiza el estado de
        los envíos (`sent` → `delivered` → `read`, o `failed` con el error de Meta).

        Siempre responde `200` cuando el payload es válido: Meta reintenta ante cualquier otro
        código.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, example: 'sha256=abc...' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Payload estándar de WhatsApp Business (entry[].changes[].value)
      responses:
        '200':
          description: Evento procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  messages: { type: integer, description: Mensajes entrantes nuevos }
                  statuses: { type: integer, description: Acuses aplicados }
        '400': { description: Cuerpo no es JSON válido }
        '403':
          description: Firma inválida
        '503':
          description: Falta `WHATSAPP_APP_SECRET`

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 de Laravel Passport 13
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            cliente: Tarjetas, sellos, canjes y promociones del cliente autenticado
            negocio: Gestión del negocio (tarjetas, recompensas, promociones, escaneos y canjes)
            admin: Administración global de la plataforma
        password:
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            cliente: Tarjetas, sellos, canjes y promociones del cliente autenticado
            negocio: Gestión del negocio
            admin: Administración global de la plataforma
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PerPage:
      name: per_page
      in: query
      description: Elementos por página (1-100)
      schema: { type: integer, default: 15, minimum: 1, maximum: 100 }
    Page:
      name: page
      in: query
      description: Número de página
      schema: { type: integer, minimum: 1, default: 1 }
    BusinessId:
      name: business
      in: path
      required: true
      schema: { type: string, format: uuid }
    LoyaltyCardId:
      name: loyaltyCard
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerCardId:
      name: customerCard
      in: path
      required: true
      schema: { type: string, format: uuid }
    RewardId:
      name: reward
      in: path
      required: true
      schema: { type: string, format: uuid }
    PromotionId:
      name: promotion
      in: path
      required: true
      schema: { type: string, format: uuid }
    RedemptionId:
      name: redemption
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    AuthSuccess:
      description: Usuario autenticado con tokens OAuth2
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              user: { $ref: '#/components/schemas/User' }
              authorization: { $ref: '#/components/schemas/TokenResponse' }
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Unauthenticated.', error: unauthenticated }
    Forbidden:
      description: Sin permisos (rol o Policy)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Esa tarjeta no pertenece a otro negocio.', error: forbidden }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'No query results for model [App\\Models\\Business].', error: not_found }
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Demasiadas peticiones (throttle)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Too Many Attempts.', error: too_many_requests }
    OAuthNotConfigured:
      description: Falta el cliente OAuth2 o las claves RSA
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: El servidor OAuth2 no está configurado correctamente.
            error: oauth_not_configured
            hint: Ejecuta `php artisan passport:install` y `php artisan punto-plus:oauth-clients --write-env`.

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }

    Error:
      type: object
      properties:
        message: { type: string }
        error: { type: string, description: Código estable del error }
        hint: { type: string, description: Detalle adicional (sólo en errores de configuración) }

    ValidationError:
      type: object
      properties:
        message: { type: string, example: Los datos enviados no son correctos. }
        error: { type: string, example: validation_error }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_grant }
        error_description: { type: string }
        hint: { type: string }
        message: { type: string }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string, nullable: true }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 86400 }
        scope: { type: string, example: cliente }

    Paginated:
      type: object
      properties:
        data: { type: array, items: {} }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Marta Ruiz }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [cliente, negocio, admin] }
        role_label: { type: string, example: Cliente }
        is_active: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        cards_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Café Aurora }
        slug: { type: string, example: cafe-aurora }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true, example: ES }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        logo_url: { type: string, nullable: true }
        background_url: { type: string, nullable: true }
        stamp_icon_url: { type: string, nullable: true }
        card_settings: { type: object, additionalProperties: true }
        is_active: { type: boolean }
        owner: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        loyalty_cards:
          type: array
          items: { $ref: '#/components/schemas/LoyaltyCard' }
        loyalty_cards_count: { type: integer, nullable: true }
        customers_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    LoyaltyCardType:
      type: string
      enum: [visits, spend]
      description: |
        Tipo de tarjeta de fidelidad:

        - `visits`: el cliente acumula **visitas** (1 por compra) y al llegar a
          `required_stamps` obtiene la recompensa del ciclo.
        - `spend`: el cliente acumula **puntos** según el monto de su consumo
          (`spend_amount_per_block` → `points_per_block`) y canjea por niveles
          (`rewards[].points_required`).
      example: visits

    CardPeriodType:
      type: string
      enum: [unlimited, days]
      description: |
        Vigencia del ciclo:

        - `unlimited`: la tarjeta se completa cuando el cliente quiera.
        - `days`: el ciclo caduca en `period_days` días y, al volver a comprar, el
          contador se reinicia y empieza un ciclo nuevo.
      example: unlimited

    PromotionScheduleType:
      type: string
      enum: [indefinite, date_range, time_range]
      description: |
        Cómo se muestra una promoción:

        - `indefinite`: sin fecha de fin; sólo `days_of_week`.
        - `date_range`: visible entre `starts_at` y `ends_at` (temporadas).
        - `time_range`: `days_of_week` dentro de `start_time`–`end_time` (hora feliz).
      example: date_range

    PromotionSchedule:
      type: object
      description: Resumen de la programación tal como quedó guardada.
      properties:
        type: { $ref: '#/components/schemas/PromotionScheduleType' }
        type_label: { type: string, example: Por rango de fechas }
        days_of_week: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, example: [5, 6] }
        days_of_week_labels: { type: array, items: { type: string }, example: [Viernes, Sábado] }
        start_time: { type: string, nullable: true, example: '18:00' }
        end_time: { type: string, nullable: true, example: '21:00' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        is_available_now: { type: boolean }

    LoyaltyCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name: { type: string, example: Club del café }
        slug: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/LoyaltyCardType' }
        type_label: { type: string, example: Por cantidad de visitas }
        progress_unit: { type: string, enum: [visits, points] }
        reward_threshold_field: { type: string, enum: [required_stamps, points_required], description: 'Campo de cada recompensa que define el umbral' }
        required_stamps: { type: integer, nullable: true, description: 'Sólo tarjetas `visits`', example: 6 }
        currency: { type: string, nullable: true, example: MXN, description: 'Sólo tarjetas `spend`' }
        spend_amount_per_block: { type: number, nullable: true, example: 100, description: 'Sólo tarjetas `spend`' }
        points_per_block: { type: integer, nullable: true, example: 10, description: 'Sólo tarjetas `spend`' }
        period_type: { $ref: '#/components/schemas/CardPeriodType' }
        period_type_label: { type: string }
        period_days: { type: integer, nullable: true, example: 30 }
        reward_description: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        background_url: { type: string, nullable: true }
        stamp_icon_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true }
        secondary_color: { type: string, nullable: true }
        text_color: { type: string, nullable: true }
        join_code: { type: string, example: CAFE2026 }
        join_url: { type: string, format: uri }
        qr: { nullable: true, allOf: [{ $ref: '#/components/schemas/QrCode' }] }
        is_active: { type: boolean }
        is_public: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        settings: { type: object, additionalProperties: true }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        rewards_count: { type: integer, nullable: true }
        customers_count: { type: integer, nullable: true }
        stamps_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Reward:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid }
        name: { type: string, example: Café gratis }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        reward_type: { type: string, enum: [free_product, discount, gift, experience] }
        reward_type_label: { type: string }
        value: { type: number, nullable: true }
        required_stamps: { type: integer, nullable: true, description: 'Tarjetas `visits`' }
        points_required: { type: integer, nullable: true, description: 'Tarjetas `spend`' }
        threshold: { type: integer, nullable: true, description: 'Umbral en la unidad del programa (visitas o puntos)' }
        threshold_unit: { type: string, enum: [visits, points] }
        stock: { type: integer, nullable: true }
        has_stock: { type: boolean }
        is_active: { type: boolean }
        redemptions_count: { type: integer }
        loyalty_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/LoyaltyCard' }] }
        created_at: { type: string, format: date-time }

    Progress:
      type: object
      description: |
        Progreso del cliente en la tarjeta. `unit` dice si avanza por `visits` o por
        `points`; `current`/`required`/`remaining`/`percentage` ya están en esa unidad.
        Las claves `stamps_*` se conservan por compatibilidad con las tarjetas por visitas.
      properties:
        unit: { type: string, enum: [visits, points] }
        current: { type: integer, description: 'Visitas o puntos acumulados' }
        required: { type: integer, nullable: true, description: 'Meta: visitas del ciclo o puntos del siguiente nivel' }
        remaining: { type: integer, nullable: true }
        percentage: { type: number, example: 33.33 }
        completed: { type: boolean }
        points_count: { type: integer, nullable: true, description: 'Sólo tarjetas `spend`' }
        total_points_earned: { type: integer, nullable: true, description: 'Sólo tarjetas `spend`' }
        next_reward:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            threshold: { type: integer }
        available_rewards_count: { type: integer, description: 'Recompensas que el cliente ya puede canjear con su saldo' }
        stamps_count: { type: integer }
        required_stamps: { type: integer }
        stamps_remaining: { type: integer }
        progress_percentage: { type: number, example: 33.33 }

    CustomerCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Código que viaja en el QR del cliente', example: AB12CD34EF }
        user_id: { type: integer }
        loyalty_card_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        progress_unit: { type: string, enum: [visits, points] }
        stamps_count: { type: integer }
        required_stamps: { type: integer }
        stamps_remaining: { type: integer }
        points_count: { type: integer, description: 'Saldo de puntos (tarjetas `spend`)' }
        total_points_earned: { type: integer }
        progress_percentage: { type: number }
        progress: { $ref: '#/components/schemas/Progress' }
        cycle:
          type: object
          description: Vigencia del ciclo cuando la tarjeta define `period_days`.
          properties:
            started_at: { type: string, format: date-time, nullable: true }
            expires_at: { type: string, format: date-time, nullable: true }
            days: { type: integer, nullable: true }
            expired: { type: boolean }
        status: { type: string, enum: [active, completed, expired, blocked] }
        status_label: { type: string }
        rewards_earned: { type: integer }
        rewards_redeemed: { type: integer }
        total_stamps_earned: { type: integer }
        completed_at: { type: string, format: date-time, nullable: true }
        last_stamp_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        loyalty_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/LoyaltyCard' }] }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        user: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        stamps:
          type: array
          items: { $ref: '#/components/schemas/Stamp' }
        created_at: { type: string, format: date-time }

    CustomerCardResponse:
      type: object
      properties:
        message: { type: string }
        already_joined: { type: boolean }
        data: { $ref: '#/components/schemas/CustomerCard' }

    Stamp:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_card_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid }
        source: { type: string, enum: [scan, manual, import, adjustment] }
        source_label: { type: string }
        purchase_amount: { type: number, nullable: true, example: 250 }
        points_awarded: { type: integer, description: 'Puntos generados por la compra (0 en tarjetas por visitas)', example: 20 }
        notes: { type: string, nullable: true }
        stamped_at: { type: string, format: date-time }
        registered_by: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        customer_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/CustomerCard' }] }
        created_at: { type: string, format: date-time }

    Promotion:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid, nullable: true }
        title: { type: string, example: 2x1 en cafés los martes }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        discount_type: { type: string, enum: [percentage, fixed_amount, free_item, gift] }
        discount_type_label: { type: string }
        discount_value: { type: number, nullable: true }
        code: { type: string, nullable: true }
        schedule_type: { $ref: '#/components/schemas/PromotionScheduleType' }
        schedule_type_label: { type: string, example: Por rango de hora }
        schedule: { $ref: '#/components/schemas/PromotionSchedule' }
        days_of_week: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, example: [5, 6] }
        days_of_week_labels: { type: array, items: { type: string }, example: [Viernes, Sábado] }
        start_time: { type: string, nullable: true, example: '18:00' }
        end_time: { type: string, nullable: true, example: '21:00' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        is_active_now: { type: boolean, description: 'Alias de `is_available_now` (compatibilidad)' }
        is_available_now: { type: boolean, description: 'true si la promoción aplica ahora (tipo, día, fecha y hora)' }
        max_redemptions: { type: integer, nullable: true }
        redemptions_count: { type: integer }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        loyalty_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/LoyaltyCard' }] }
        created_at: { type: string, format: date-time }

    BusinessCategory:
      type: object
      description: Categoría asociada al negocio.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: integer }
        name: { type: string, example: cafetería }
        icon: { type: string }
        sort_order: { type: integer, nullable: true }

    ClientBusiness:
      type: object
      description: |
        Resumen de negocio tal como lo consume la app del cliente (sin menú ni tarjetas
        anidadas). Los contadores y la distancia sólo aparecen cuando el endpoint los calcula.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Café Aurora }
        slug: { type: string, example: cafe-aurora }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        background_url: { type: string, nullable: true }
        stamp_icon_url: { type: string, nullable: true }
        card_settings: { type: object, additionalProperties: true }
        phone: { type: string, nullable: true }
        phone_numbers: { type: array, items: { type: string } }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true, example: ES }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        categories:
          type: array
          items: { $ref: '#/components/schemas/BusinessCategory' }
        loyalty_cards_count: { type: integer, nullable: true }
        active_loyalty_cards_count: { type: integer, nullable: true }
        active_promotions_count: { type: integer, nullable: true }
        distance_km: { type: number, nullable: true, description: 'Distancia al punto enviado (sólo en búsquedas por cercanía)' }
        has_card: { type: boolean, nullable: true, description: 'El cliente tiene o ha tenido tarjeta en este negocio' }
        is_active: { type: boolean }

    ClientPromotion:
      type: object
      description: Promoción vista desde la app del cliente, con el negocio que la publica.
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid, nullable: true }
        title: { type: string, example: 2x1 en cafés los martes }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        discount_type: { type: string, enum: [percentage, fixed_amount, free_item, gift] }
        discount_type_label: { type: string }
        discount_value: { type: number, nullable: true }
        code: { type: string, nullable: true }
        schedule_type: { $ref: '#/components/schemas/PromotionScheduleType' }
        schedule_type_label: { type: string, example: Por rango de hora }
        schedule: { $ref: '#/components/schemas/PromotionSchedule' }
        days_of_week: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        days_of_week_labels: { type: array, items: { type: string }, example: [Viernes, Sábado] }
        start_time: { type: string, nullable: true, example: '18:00' }
        end_time: { type: string, nullable: true, example: '21:00' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        is_active_now: { type: boolean, description: 'Alias de `is_available_now` (compatibilidad)' }
        is_available_now: { type: boolean, description: 'true si la promoción aplica ahora (tipo, día, fecha y hora)' }
        max_redemptions: { type: integer, nullable: true }
        redemptions_count: { type: integer }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/ClientBusiness' }] }
        loyalty_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/LoyaltyCard' }] }
        created_at: { type: string, format: date-time }

    WhatsAppMessage:
      type: object
      description: Envío, mensaje entrante o acuse de WhatsApp.
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [outgoing, incoming] }
        direction_label: { type: string }
        status: { type: string, enum: [queued, sent, delivered, read, received, failed] }
        status_label: { type: string }
        wa_message_id: { type: string, nullable: true, example: wamid.HBgNNTIx... }
        business_id: { type: string, format: uuid, nullable: true }
        from_phone: { type: string, nullable: true, example: '+5215598765432' }
        to_phone: { type: string, nullable: true, example: '+5215512345678' }
        type: { type: string, enum: [text, template, image, document, audio, video, sticker, location, contacts, reaction, unknown] }
        template_name: { type: string, nullable: true }
        template_language: { type: string, nullable: true }
        body: { type: string, nullable: true }
        error: { type: string, nullable: true }
        error_code: { type: string, nullable: true, example: '131030' }
        sent_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    WhatsAppTemplate:
      type: object
      properties:
        id: { type: string, example: '111222333' }
        name: { type: string, example: promo_sellos }
        status: { type: string, enum: [APPROVED, PENDING, REJECTED, PAUSED, DISABLED] }
        category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
        language: { type: string, example: es_MX }
        components:
          type: array
          items: { type: object, additionalProperties: true }

    Redemption:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PP-8F3K2L9Q }
        status: { type: string, enum: [pending, completed, rejected, cancelled] }
        status_label: { type: string }
        stamps_used: { type: integer, description: 'Sellos consumidos (tarjetas `visits`)' }
        points_used: { type: integer, description: 'Puntos consumidos (tarjetas `spend`)' }
        redeemed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        customer_card_id: { type: string, format: uuid }
        reward_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        user_id: { type: integer }
        reward: { nullable: true, allOf: [{ $ref: '#/components/schemas/Reward' }] }
        customer_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/CustomerCard' }] }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        user: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        approved_by: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        created_at: { type: string, format: date-time }

    QrCode:
      type: object
      description: |
        QR generado por el servidor. `payload` es el objeto que la app puede volver
        a codificar sin conexión; `json` es la cadena exacta que viaja dentro del QR
        y `svg` su representación gráfica (null si bacon/bacon-qr-code no está instalado).

        - `loyalty_card.join` (lo escanea el cliente para unirse): `join_code`, `loyalty_card_id`,
          `business_id`, `business` (nombre) y `url`.
        - `customer_card.identify` (lo escanea el negocio para sellar): `code`, `loyalty_card_id`,
          `business_id`, `holder` (nombre del cliente), `stamps` y `required_stamps`.
      properties:
        payload:
          type: object
          description: Contenido estructurado del QR (para regenerarlo en la app)
          properties:
            v: { type: integer, example: 1, description: Versión del formato del payload }
            type: { type: string, enum: [loyalty_card.join, customer_card.identify] }
            join_code: { type: string, nullable: true, description: 'Código de alta del programa (payload loyalty_card.join)' }
            code: { type: string, nullable: true, description: 'Código de la tarjeta del cliente (payload customer_card.identify)' }
            loyalty_card_id: { type: string, format: uuid, nullable: true }
            business_id: { type: string, format: uuid, nullable: true }
            business: { type: string, nullable: true, description: Nombre del negocio (si venía cargado en la petición) }
            holder: { type: string, nullable: true, description: Nombre del cliente titular de la tarjeta }
            stamps: { type: integer, nullable: true, example: 3, description: Sellos acumulados en el momento de generar el QR }
            required_stamps: { type: integer, nullable: true, example: 10 }
            url: { type: string, format: uri, nullable: true, example: 'https://puntoplus.test/join?code=CAFE2026' }
        json: { type: string, description: Cadena JSON exacta que codifica el QR }
        svg: { type: string, nullable: true, description: 'SVG del QR (null si bacon/bacon-qr-code no está instalado)' }

security:
  - Bearer: []
