        '200':
          description: Clientes, sellos, recompensas y canjes
          content:
            application/json:
              schema:
                type: object
                properties:
                  loyalty_card_id: { type: string, format: uuid }
                  customers: { type: integer }
                  customers_completed: { type: integer }
                  stamps_total: { type: integer }
                  stamps_last_30_days: { type: integer }
                  rewards_earned: { type: integer }
                  rewards_redeemed: { type: integer }
                  rewards_available: { type: integer }
                  redemptions_completed: { type: integer }
                  rewards_defined: { type: integer }
                  generated_at: { type: string, format: date-time }

  /api/business/cards/{loyaltyCard}/rewards:
    parameters:
      - $ref: '#/components/parameters/LoyaltyCardId'
    get:
      tags: [Negocio]
      summary: Recompensas de una tarjeta
      security: [{ OAuth2: [] }]
      parameters:
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Recompensas ordenadas por sellos requeridos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reward' }
    post:
      tags: [Negocio]
      summary: Crear una recompensa (nivel de la tarjeta)
      description: |
        El umbral se mide en la unidad del tipo de tarjeta:

        - tarjeta `visits` → `required_stamps` (si se omite se usa el de la tarjeta);
        - tarjeta `spend` → `points_required` (**obligatorio**) y las recompensas
          funcionan como niveles: 200 puntos → refresco, 500 puntos → hamburguesa.

        No puede haber dos recompensas con el mismo umbral.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120, example: Café gratis }
                description: { type: string, maxLength: 500, nullable: true }
                reward_type: { type: string, enum: [free_product, discount, gift, experience] }
                value: { type: number, nullable: true }
                required_stamps: { type: integer, minimum: 1, maximum: 100, nullable: true, description: 'Tarjetas `visits`.' }
                points_required: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: 'Tarjetas `spend` (obligatorio en ellas).', example: 200 }
                stock: { type: integer, nullable: true, description: 'null = stock ilimitado' }
                is_active: { type: boolean, default: true }
            examples:
              nivelDePuntos:
                summary: Nivel por puntos
                value: { name: Refresco 600 ml, points_required: 200, reward_type: free_product }
              nivelDeVisitas:
                summary: Nivel por visitas
                value: { name: Café gratis, required_stamps: 6, reward_type: free_product }
      responses:
        '201':
          description: Recompensa creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Reward' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/rewards/{reward}:
    parameters:
      - $ref: '#/components/parameters/RewardId'
    put:
      tags: [Negocio]
      summary: Editar una recompensa
      description: Sólo se actualizan los campos enviados. El umbral debe ir en la unidad de la tarjeta (`required_stamps` o `points_required`).
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                reward_type: { type: string, enum: [free_product, discount, gift, experience] }
                value: { type: number, nullable: true }
                required_stamps: { type: integer, minimum: 1, maximum: 100, nullable: true, description: 'Tarjetas `visits`.' }
                points_required: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: 'Tarjetas `spend`.' }
                stock: { type: integer, nullable: true }
                is_active: { type: boolean }
      responses:
        '200':
          description: Recompensa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Reward' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Negocio]
      summary: Eliminar una recompensa
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Recompensa eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/business/promotions:
    get:
      tags: [Negocio]
      summary: Promociones del negocio
      security: [{ OAuth2: [] }]
      parameters:
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: loyalty_card_id, in: query, schema: { type: string, format: uuid } }
        - { name: schedule_type, in: query, description: 'Filtra por forma de programación', schema: { $ref: '#/components/schemas/PromotionScheduleType' } }
        - { name: available_now, in: query, description: 'Sólo las que se muestran en este momento (tipo, día, fecha y hora)', schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Promociones paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Promotion' }
    post:
      tags: [Negocio]
      summary: Crear una promoción (aviso)
      description: |
        La forma de mostrarse la decide `schedule_type`:

        | `schedule_type` | Campos obligatorios | Ejemplo |
        | --- | --- | --- |
        | `indefinite` | `days_of_week` | Aviso permanente de lunes a viernes |
        | `date_range` | `starts_at`, `ends_at` | Promoción navideña del 1 al 24 de diciembre |
        | `time_range` | `days_of_week`, `start_time`, `end_time` | Hora feliz viernes y sábado de 18:00 a 21:00 |

        - `days_of_week` usa ISO-8601: **1 = lunes … 7 = domingo** (arreglo de 1 a 7 días).
        - `start_time`/`end_time` van en formato **HH:MM** (24 h) y la franja puede
          cruzar la medianoche (por ejemplo `20:00` → `02:00`).
        - Los campos que no aplican a la programación elegida se ignoran y se guardan
          en `null` (una promoción indefinida no tiene fechas).
        - `is_available_now` y `schedule.is_available_now` de la respuesta ya evalúan
          día, fecha y hora con la hora del servidor.

        Ejemplos completos: *indefinida*, *rangoDeFechas* y *rangoDeHora*.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, discount_type]
              properties:
                title: { type: string, maxLength: 150, example: 2x1 en cafés los martes }
                description: { type: string, maxLength: 2000, nullable: true }
                terms: { type: string, maxLength: 2000, nullable: true }
                loyalty_card_id: { type: string, format: uuid, nullable: true, description: 'Tarjeta a la que aplica (opcional)' }
                discount_type: { type: string, enum: [percentage, fixed_amount, free_item, gift] }
                discount_value: { type: number, nullable: true, description: 'Obligatorio si el descuento es `percentage` o `fixed_amount`.' }
                code: { type: string, maxLength: 32, nullable: true, example: MARTES2X1 }

                # --- Programación ---
                schedule_type: { $ref: '#/components/schemas/PromotionScheduleType' }
                days_of_week: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, minItems: 1, maxItems: 7, description: 'ISO-8601: 1 = lunes … 7 = domingo. Obligatorio en `indefinite` y `time_range`.', example: [5, 6] }
                start_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true, description: 'HH:MM (24 h). Obligatorio en `time_range`.', example: '18:00' }
                end_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true, description: 'HH:MM (24 h). Puede ser menor que `start_time` si cruza medianoche.', example: '21:00' }
                starts_at: { type: string, format: date, nullable: true, description: 'Obligatorio en `date_range`. Se guarda al inicio del día.' }
                ends_at: { type: string, format: date, nullable: true, description: 'Obligatorio en `date_range`. Se guarda al final del día.' }

                max_redemptions: { type: integer, nullable: true }
                is_active: { type: boolean, default: true }
            examples:
              indefinida:
                summary: Tiempo indefinido (sólo días de la semana)
                value:
                  title: Martes de 2x1 en café
                  description: Todos los martes, todo el día
                  discount_type: percentage
                  discount_value: 50
                  schedule_type: indefinite
                  days_of_week: [2]
              rangoDeFechas:
                summary: Por rango de fechas (temporada)
                value:
                  title: Promoción navideña
                  description: 20% en toda la tienda
                  discount_type: percentage
                  discount_value: 20
                  code: NAVIDAD20
                  schedule_type: date_range
                  starts_at: '2026-12-01'
                  ends_at: '2026-12-24'
              rangoDeHora:
                summary: Por rango de hora (hora feliz)
                value:
                  title: Hora feliz
                  description: 2x1 en bebidas
                  discount_type: free_item
                  schedule_type: time_range
                  days_of_week: [5, 6]
                  start_time: '18:00'
                  end_time: '21:00'
      responses:
        '201':
          description: Promoción creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Promotion' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/promotions/{promotion}:
    parameters:
      - $ref: '#/components/parameters/PromotionId'
    get:
      tags: [Negocio]
      summary: Detalle de una promoción
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Promoción
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Promotion' }
    put:
      tags: [Negocio]
      summary: Editar una promoción
      description: |
        Sólo se actualizan los campos enviados. Si se envía `schedule_type`, hay que
        enviar también los campos que ese tipo necesita (`days_of_week`, fechas o
        horas); si no se envía `schedule_type`, se conserva el actual y se normalizan
        los campos de programación que sí se envíen.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 150 }
                description: { type: string, maxLength: 2000, nullable: true }
                terms: { type: string, maxLength: 2000, nullable: true }
                loyalty_card_id: { type: string, format: uuid, nullable: true }
                discount_type: { type: string, enum: [percentage, fixed_amount, free_item, gift] }
                discount_value: { type: number, nullable: true }
                code: { type: string, maxLength: 32, nullable: true }
                schedule_type: { $ref: '#/components/schemas/PromotionScheduleType' }
                days_of_week: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, minItems: 1, maxItems: 7, description: 'Obligatorio al pasar a `indefinite` o `time_range`.' }
                start_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true, description: 'HH:MM (24 h). Obligatorio al pasar a `time_range`.' }
                end_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true }
                starts_at: { type: string, format: date, nullable: true, description: 'Obligatorio al pasar a `date_range`.' }
                ends_at: { type: string, format: date, nullable: true, description: 'No puede ser anterior a `starts_at`.' }
                max_redemptions: { type: integer, nullable: true }
                is_active: { type: boolean }
            examples:
              pasarAHoraFeliz:
                summary: Convertir la promoción en hora feliz
                value:
                  schedule_type: time_range
                  days_of_week: [4, 5]
                  start_time: '19:00'
                  end_time: '22:00'
      responses:
        '200':
          description: Promoción actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Promotion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Negocio]
      summary: Eliminar una promoción
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Promoción eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /api/business/stamps/scan:
    post:
      tags: [Negocio]
      summary: Registrar un sello escaneando el QR del cliente
      description: |
        Valida que la tarjeta pertenece al negocio y está activa, aplica el *throttle*
        anti-fraude (`CARD_STAMP_THROTTLE_SECONDS`) y el máximo diario
        (`CARD_MAX_STAMPS_PER_DAY`), registra la compra y actualiza el progreso dentro de
        una transacción.

        - Tarjeta `visits`: suma una visita; al llegar a `required_stamps` pasa a `completed`.
        - Tarjeta `spend`: `purchase_amount` es **obligatorio** y debe alcanzar al menos un
          bloque de gasto. Los puntos se calculan con la regla de la tarjeta
          (`floor(monto / spend_amount_per_block) * points_per_block`) y se devuelven en
          `data.points_awarded`.

        Si el ciclo de la tarjeta había caducado (`period_days`), se reinicia antes de sumar.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'Contenido del QR del cliente (JSON, URL o texto)', example: AB12CD34EF }
                purchase_amount: { type: number, format: float, nullable: true, description: 'Monto de la compra. Obligatorio en tarjetas por consumo y debe cubrir al menos un bloque de gasto.', example: 250 }
                notes: { type: string, nullable: true }
                stamped_at: { type: string, format: date-time, nullable: true }
                source: { type: string, enum: [scan, manual, import, adjustment] }
                idempotency_key: { type: string, nullable: true }
      responses:
        '201':
          description: Sello registrado (incluye el resumen de la tarjeta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Sello registrado. }
                  data: { $ref: '#/components/schemas/Stamp' }
                  customer_card:
                    type: object
                    description: Resumen del progreso después de la compra.
                    properties:
                      id: { type: string, format: uuid }
                      code: { type: string }
                      progress_unit: { type: string, enum: [visits, points] }
                      stamps_count: { type: integer }
                      required_stamps: { type: integer }
                      points_count: { type: integer }
                      total_points_earned: { type: integer }
                      progress_percentage: { type: number }
                      progress: { $ref: '#/components/schemas/Progress' }
                      status: { type: string, enum: [active, completed, expired, blocked] }
                      reward_available: { type: boolean, description: 'En tarjetas por consumo: hay alguna recompensa alcanzada con sus puntos' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/stamps/recent:
    get:
      tags: [Negocio]
      summary: Últimos escaneos del negocio
      security: [{ OAuth2: [] }]
