openapi: 3.0.3

info:
  title: Punto Plus API
  version: 1.0.0
  description: |
    API REST de **fidelidad digital para pequeñas empresas**: tarjetas de sellos,
    recompensas, promociones y canjes.

    **Autenticación OAuth2 (Laravel Passport 13)** con los scopes `cliente`, `negocio` y `admin`
    (informativos: no restringen el acceso; la autorización la resuelven el rol y las Policies):

    - `Authorization Code + PKCE` para la app móvil de clientes (`/oauth/authorize` + `/oauth/token`).
    - `Password grant` para apps propias de confianza (`POST /api/auth/login`, `POST /api/auth/register`).
    - `Refresh token` para renovar el acceso (`POST /api/auth/refresh`).

    Las respuestas de recurso se envuelven en `data` (+ `meta` y `links` al paginar). Los errores
    incluyen `message` y un código estable en `error` (`invalid_credentials`, `forbidden`, ...).

    ## Tarjetas de negocio (`POST /api/business/cards`)

    Existen **dos tipos** (`type`):

    1. `visits` — **por cantidad de visitas**: el negocio fija cuántas visitas hacen falta
       (`required_stamps`) dentro de un lapso (`period_type: days` + `period_days`) o sin
       límite (`period_type: unlimited`). Cada compra suma una visita.
    2. `spend` — **por consumo**: cada bloque de gasto suma puntos
       (`spend_amount_per_block` → `points_per_block`, por ejemplo $100 = 10 puntos) y las
       recompensas son niveles de puntos (`rewards[].points_required`): 200 puntos = refresco,
       500 puntos = hamburguesa con papas.

    ## Promociones (`POST /api/business/promotions`)

    Existen **tres formas de programación** (`schedule_type`):

    1. `indefinite` — **tiempo indefinido**: sin fecha de fin, se muestra uno o varios días
       de la semana (`days_of_week`).
    2. `date_range` — **por rango de fechas**: visible sólo entre `starts_at` y `ends_at`
       (festividades) y desaparece al terminar.
    3. `time_range` — **por rango de hora**: uno o varios días de la semana dentro de
       `start_time`–`end_time` (hora feliz; la franja puede cruzar la medianoche).

    Los días de la semana usan ISO-8601: **1 = lunes … 7 = domingo**. Los request bodies
    incluyen ejemplos completos para cada variante.
  contact:
    name: Punto Plus
    email: hola@puntoplus.test
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Desarrollo local
  - url: https://api.puntoplus.test
    description: Producción (ejemplo)

tags:
  - name: OAuth2
    description: Endpoints del servidor OAuth2 de Passport
  - name: Autenticación
    description: Registro, login, refresh y cierre de sesión
  - name: Perfil
    description: Usuario autenticado
  - name: Cliente
    description: Área del cliente
  - name: Negocio
    description: Área del negocio (middleware de rol `role:business,admin`)
  - name: Público
    description: Endpoints sin autenticación
  - name: Webhooks
    description: Webhooks de terceros (Meta) sin token OAuth2

paths:
  /:
    get:
      tags: [Público]
      summary: Índice de la API
      responses:
        '200':
          description: Nombre, versión, enlaces a docs, health y OAuth2
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: Punto Plus }
                  api: { type: string, example: Punto Plus API }
                  version: { type: string, example: 1.0.0 }
                  docs: { type: string, format: uri }
                  health: { type: string, format: uri }

  /up:
    get:
      tags: [Público]
      summary: Health check
      responses:
        '200': { description: La aplicación responde }

  /oauth/token:
    post:
      tags: [OAuth2]
      summary: Endpoint OAuth2 de tokens
      description: |
        Acepta `grant_type=password`, `refresh_token`, `authorization_code` (PKCE) y
        `client_credentials`. Requiere `client_id` y, si el cliente es confidencial,
        `client_secret`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token, authorization_code, client_credentials]
                client_id: { type: string, format: uuid }
                client_secret: { type: string }
                username: { type: string, format: email, description: Sólo password grant }
                password: { type: string, description: Sólo password grant }
                refresh_token: { type: string, description: Sólo refresh_token grant }
                code: { type: string, description: Sólo authorization_code grant }
                code_verifier: { type: string, description: PKCE }
                redirect_uri: { type: string, description: Sólo authorization_code grant }
                scope: { type: string, example: cliente }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Petición OAuth2 inválida (`invalid_grant`, `invalid_client`, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Credenciales del cliente o del usuario inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /oauth/authorize:
    get:
      tags: [OAuth2]
      summary: Pantalla de consentimiento (Authorization Code + PKCE)
      description: |
        Requiere sesión de navegador (guard `web`); si no la hay, redirige a `/login`.
        El usuario aprueba los scopes en la vista personalizada
        (`Passport::authorizationView('auth.oauth.authorize')`) y la app recibe el `code`.
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: scope, in: query, schema: { type: string, example: cliente } }
        - { name: state, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, schema: { type: string } }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256, plain] } }
      responses:
        '200':
          description: Vista HTML de consentimiento
          content:
            text/html:
              schema: { type: string }
        '302':
          description: Redirección a `/login` o a la `redirect_uri` con el código

  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registro de cliente o negocio
      description: |
        Crea el usuario (`role`: `cliente` o `negocio`; `admin` nunca es autoasignable).
        Si el rol es `negocio` hay que enviar el bloque `business`. Devuelve tokens OAuth2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, role]
              properties:
                name: { type: string, maxLength: 150, example: Lucía Gómez }
                email: { type: string, format: email, example: lucia@example.com }
                phone: { type: string, nullable: true, example: '+34600111222' }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                role: { type: string, enum: [cliente, negocio] }
                device_name: { type: string, nullable: true, example: 'iPhone 15' }
                scopes:
                  type: array
                  nullable: true
                  items: { type: string, enum: [cliente, negocio, admin] }
                business:
                  type: object
                  description: Obligatorio si `role` es `negocio`
                  properties:
                    name: { type: string, example: Café Aurora }
                    description: { type: string, nullable: true }
                    category: { type: string, nullable: true, example: cafetería }
                    phone: { type: string, nullable: true }
                    email: { type: string, format: email, nullable: true }
                    website: { type: string, nullable: true }
                    address: { type: string, nullable: true }
                    city: { type: string, nullable: true, example: Valencia }
                    country: { type: string, nullable: true, minLength: 2, maxLength: 2, example: ES }
                    latitude: { type: number, format: float, nullable: true }
                    longitude: { type: number, format: float, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/OAuthNotConfigured' }

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicio de sesión (password grant)
      description: |
        Emite un `access_token` + `refresh_token` a través del password grant de Passport.
        Si el cliente password grant no está configurado, la API emite un token personal
        (sin refresh token) y lo registra en el log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, nullable: true }
                scopes:
                  type: array
                  nullable: true
                  items: { type: string, enum: [cliente, negocio, admin] }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Las credenciales no son correctas.', error: invalid_credentials }
        '403':
          description: Cuenta desactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Tu cuenta está desactivada. Contacta con soporte.', error: account_disabled }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/OAuthNotConfigured' }

  /api/auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                scope: { type: string, nullable: true }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Token renovado. }
                  authorization: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Refresh token inválido o caducado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'El refresh token no es válido o ha caducado. Vuelve a iniciar sesión.', error: invalid_refresh_token }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión actual
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Token revocado (y su refresh token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Sesión cerrada. }
                  revoked_refresh_tokens: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout-all:
    post:
      tags: [Autenticación]
      summary: Cerrar todas las sesiones
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Todos los tokens del usuario revocados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Se cerraron todas las sesiones. }
                  revoked_tokens: { type: integer, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/user:
    get:
      tags: [Perfil]
      summary: Perfil del usuario autenticado
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Perfil]
      summary: Actualizar el perfil
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, nullable: true }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/user/password:
    put:
      tags: [Perfil]
      summary: Cambiar la contraseña (revoca las demás sesiones)
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/businesses:
    get:
      tags: [Público]
      summary: Directorio de negocios activos
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Listado paginado de negocios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Business' }

  /api/businesses/{business}:
    get:
      tags: [Público]
      summary: Ficha pública de un negocio con sus tarjetas
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Negocio con tarjetas activas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Business' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/customer/cards:
    get:
      tags: [Cliente]
      summary: Mis tarjetas de fidelidad
      security: [{ OAuth2: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, completed, expired, blocked] } }
        - { name: business_id, in: query, schema: { type: string, format: uuid } }
        - { name: with_stamps, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Tarjetas del cliente con su progreso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/customer/cards/join:
    post:
      tags: [Cliente]
      summary: Unirse a un programa escaneando el QR del negocio
      description: |
        Acepta el `code` del negocio (texto plano, payload JSON del QR, URL con `?code=` o
        deep link) o el `loyalty_card_id`. Es idempotente: si el cliente ya tenía tarjeta,
        devuelve `200` con `already_joined: true` y el progreso intacto.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: 'Contenido del QR (obligatorio si no se envía loyalty_card_id)', example: CAFE2026 }
                loyalty_card_id: { type: string, format: uuid }
      responses:
        '201':
          description: Alta realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCardResponse' }
        '200':
          description: Ya estaba unido al programa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCardResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/customer/cards/{customerCard}:
    parameters:
      - $ref: '#/components/parameters/CustomerCardId'
    get:
      tags: [Cliente]
      summary: Detalle de una de mis tarjetas (con últimos sellos)
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Tarjeta con sellos y recompensas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerCard' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Cliente]
      summary: Salir del programa (conserva el progreso)
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Tarjeta archivada (borrado lógico)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/customer/cards/{customerCard}/stamps:
    get:
      tags: [Cliente]
      summary: Historial de sellos de una tarjeta
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerCardId'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Sellos paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Stamp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/customer/cards/{customerCard}/rewards:
    get:
      tags: [Cliente]
      summary: Recompensas disponibles y cuáles puedo canjear
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerCardId'
      responses:
        '200':
          description: Recompensas del programa indicando si el cliente ya puede canjearlas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Reward'
                        - type: object
                          properties:
                            threshold: { type: integer, nullable: true, description: 'Umbral en la unidad del programa' }
                            threshold_unit: { type: string, enum: [visits, points] }
                            can_redeem: { type: boolean }
                            missing_units: { type: integer, description: 'Visitas o puntos que faltan para esta recompensa' }
                            missing_stamps: { type: integer, description: 'Compatibilidad: sólo tarjetas `visits` (0 en las de puntos)' }
                            missing_points: { type: integer, description: 'Sólo tarjetas `spend`' }
                  progress_unit: { type: string, enum: [visits, points] }
                  progress: { $ref: '#/components/schemas/Progress' }

  /api/customer/cards/{customerCard}/qr:
    get:
      tags: [Cliente]
      summary: QR que el negocio escanea para sellar
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerCardId'
      responses:
        '200':
          description: Payload del QR (JSON) y su SVG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrCode' }

  /api/customer/cards/{customerCard}/redeem:
    post:
      tags: [Cliente]
      summary: Solicitar el canje de una recompensa
      description: |
        Descuenta los sellos necesarios y reserva una unidad de stock. Devuelve el código
        `PP-XXXXXXXX` que el cliente muestra en el negocio. No se admiten dos canjes
        pendientes en la misma tarjeta.
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerCardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
                reward_id: { type: string, format: uuid }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Canje solicitado (pendiente de validación)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Redemption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/customer/redemptions:
    get:
      tags: [Cliente]
      summary: Mis canjes
      security: [{ OAuth2: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, completed, rejected, cancelled] } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Canjes paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Redemption' }

  /api/customer/redemptions/{redemption}:
    get:
      tags: [Cliente]
      summary: Detalle de un canje (incluye el código a mostrar)
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '200':
          description: Canje
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Redemption' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/customer/redemptions/{redemption}/cancel:
    post:
      tags: [Cliente]
      summary: Cancelar un canje pendiente (devuelve sellos y stock)
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '200':
          description: Canje cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Redemption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/client/promotions:
    get:
      tags: [Cliente]
      summary: Promociones de los negocios donde tengo o he tenido tarjeta
      description: |
        Promociones **vigentes** (`is_active` y dentro de su ventana de fechas) de todos los
        negocios con los que el cliente tiene o ha tenido tarjeta. Las tarjetas de las que se
        dio de baja cuentan: la baja es un borrado lógico, así que el histórico sigue dando acceso
        a las promociones del negocio.

        Cada promoción indica cómo se muestra (`schedule_type`: `indefinite`, `date_range` o
        `time_range`) y `is_available_now` dice si aplica en este momento. Usa
        `available_now=true` para quedarte sólo con las vigentes ahora mismo (por ejemplo,
        la hora feliz de 18:00 a 21:00).
      security: [{ OAuth2: [] }]
      parameters:
        - { name: business_id, in: query, description: Limita el listado a un negocio, schema: { type: string, format: uuid } }
        - { name: search, in: query, description: Busca en título y descripción, schema: { type: string } }
        - { name: discount_type, in: query, description: Tipo de descuento, schema: { type: string, enum: [percentage, fixed_amount, free_item, gift] } }
        - { name: schedule_type, in: query, description: 'Forma de programación del aviso', schema: { $ref: '#/components/schemas/PromotionScheduleType' } }
        - { name: available_now, in: query, description: 'Si es `true`, sólo devuelve las que aplican en este momento (día, fecha y hora)', schema: { type: boolean } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Promociones paginadas, las más recientes primero
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ClientPromotion' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/client/near-me:
    get:
      tags: [Cliente]
      summary: Negocios a menos de 10 km de mi ubicación
      description: |
        Negocios activos con coordenadas dentro del radio indicado (10 km por defecto),
        ordenados de más cerca a más lejos. El servidor filtra primero por una caja
        delimitadora en SQL y calcula la distancia exacta (Haversine) para recortar y ordenar.

        `distance_km` viene redondeado a dos decimales y `has_card` indica si el cliente
        ya tiene tarjeta (o la ha tenido) en ese negocio.
      security: [{ OAuth2: [] }]
      parameters:
        - { name: latitude, in: query, required: true, description: Latitud del cliente, schema: { type: number, format: double, minimum: -90, maximum: 90 }, example: 19.4326 }
        - { name: longitude, in: query, required: true, description: Longitud del cliente, schema: { type: number, format: double, minimum: -180, maximum: 180 }, example: -99.1332 }
        - { name: radius, in: query, description: Radio de búsqueda en kilómetros, schema: { type: number, format: double, default: 10, minimum: 0.1, maximum: 100 } }
        - { name: search, in: query, description: Busca en nombre, descripción y categoría, schema: { type: string } }
        - { name: category, in: query, description: Categoría exacta del negocio, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Negocios cercanos junto al centro y radio aplicados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ClientBusiness' }
                      center:
                        type: object
                        properties:
                          latitude: { type: number, example: 19.4326 }
                          longitude: { type: number, example: -99.1332 }
                          radius_km: { type: number, example: 10 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/customer/promotions:
    get:
      tags: [Cliente]
      summary: 'Alias histórico de `/api/client/promotions`'
      description: Se mantiene por compatibilidad; ejecuta la misma acción con la misma semántica.
      deprecated: true
      security: [{ OAuth2: [] }]
      parameters:
        - { name: business_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Promociones vigentes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ClientPromotion' }

