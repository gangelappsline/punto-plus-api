  /api/business/cards:
    get:
      tags: [Negocio]
      summary: Tarjetas del negocio
      security: [{ OAuth2: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: type, in: query, description: 'Filtra por tipo de tarjeta', schema: { $ref: '#/components/schemas/LoyaltyCardType' } }
        - { name: period_type, in: query, description: 'Filtra por vigencia del ciclo', schema: { $ref: '#/components/schemas/CardPeriodType' } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Tarjetas paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LoyaltyCard' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Negocio]
      summary: Crear una tarjeta de fidelidad (por visitas o por consumo)
      description: |
        Existen **dos tipos de tarjeta** y `type` decide qué campos hay que enviar:

        | `type` | Cómo avanza el cliente | Campos obligatorios | Recompensas |
        | --- | --- | --- | --- |
        | `visits` (por defecto) | Suma **1 visita** por compra | `required_stamps` (si se omite: `CARD_DEFAULT_REQUIRED_STAMPS`, 10) | `rewards[].required_stamps` |
        | `spend` | Suma **puntos** por cada bloque de gasto | `spend_amount_per_block`, `points_per_block` y al menos 1 recompensa con `points_required` | varios niveles de puntos |

        **Vigencia del ciclo** (aplica a los dos tipos): `period_type: unlimited`
        (se completa cuando el cliente quiera) o `period_type: days` + `period_days`
        (el ciclo caduca y el contador vuelve a cero).

        Ejemplos completos: *tarjetaPorVisitas* y *tarjetaPorConsumo*.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120, example: Club del café }
                description: { type: string, maxLength: 1000, nullable: true }
                type: { $ref: '#/components/schemas/LoyaltyCardType' }

                # --- Sólo tarjetas por visitas ---
                required_stamps: { type: integer, minimum: 1, maximum: 100, nullable: true, description: 'Sólo `type: visits`. Visitas necesarias para la recompensa del ciclo.', example: 6 }

                # --- Sólo tarjetas por consumo ---
                spend_amount_per_block: { type: number, format: float, minimum: 1, maximum: 999999.99, nullable: true, description: 'Sólo `type: spend`. Monto de consumo que suma un bloque de puntos.', example: 100 }
                points_per_block: { type: integer, minimum: 1, maximum: 10000, nullable: true, description: 'Sólo `type: spend`. Puntos que otorga cada bloque.', example: 10 }
                currency: { type: string, minLength: 3, maxLength: 3, nullable: true, default: MXN, example: MXN }

                # --- Vigencia del ciclo ---
                period_type: { $ref: '#/components/schemas/CardPeriodType' }
                period_days: { type: integer, minimum: 1, maximum: 3650, nullable: true, description: 'Obligatorio si `period_type: days`.', example: 30 }

                reward_description: { type: string, maxLength: 180, nullable: true }
                terms: { type: string, maxLength: 2000, nullable: true }
                primary_color: { type: string, nullable: true, example: '#F59E0B' }
                secondary_color: { type: string, nullable: true }
                text_color: { type: string, nullable: true }
                is_active: { type: boolean, default: true }
                is_public: { type: boolean, default: true }
                expires_at: { type: string, format: date-time, nullable: true, description: Fecha en la que el programa deja de estar disponible }
                inherit_business_branding: { type: boolean, default: true, description: Hereda logo, fondo, icono y colores del negocio }
                settings:
                  type: object
                  additionalProperties: true
                  properties:
                    stamp_icon: { type: string, enum: [star, heart, coffee, leaf, bolt, crown, circle] }
                    card_shape: { type: string, enum: [rounded, square, pill] }
                    welcome_message: { type: string, maxLength: 180 }
                    stamps_lifetime_days: { type: integer, nullable: true }
                rewards:
                  type: array
                  maxItems: 20
                  description: 'Recompensas iniciales. Obligatorio (mínimo 1) cuando `type: spend`; en `visits` es opcional.'
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 120, example: Café gratis }
                      description: { type: string, maxLength: 500, nullable: true }
                      reward_type: { type: string, enum: [free_product, discount, gift, experience] }
                      value: { type: number, nullable: true }
                      required_stamps: { type: integer, minimum: 1, maximum: 100, nullable: true, description: 'Sólo tarjetas `visits`. Si se omite se usa el de la tarjeta.' }
                      points_required: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: 'Sólo tarjetas `spend`. Nivel de puntos que desbloquea la recompensa.' }
                      stock: { type: integer, nullable: true, description: 'null = stock ilimitado' }
                      is_active: { type: boolean, default: true }
            examples:
              tarjetaPorVisitas:
                summary: Por cantidad de visitas (6 visitas en un lapso de 30 días)
                value:
                  name: Club del café
                  type: visits
                  required_stamps: 6
                  period_type: days
                  period_days: 30
                  reward_description: Café de especialidad gratis
                  rewards:
                    - name: Croissant gratis
                      required_stamps: 3
                    - name: Café gratis
                      required_stamps: 6
              tarjetaPorConsumo:
                summary: Por consumo (cada $100 de compra = 10 puntos)
                value:
                  name: Puntos Aurora
                  type: spend
                  spend_amount_per_block: 100
                  points_per_block: 10
                  currency: MXN
                  period_type: unlimited
                  reward_description: Canjea tus puntos por producto
                  rewards:
                    - name: Refresco 600 ml
                      points_required: 200
                    - name: Hamburguesa con papas
                      points_required: 500
      responses:
        '201':
          description: Tarjeta creada con sus recompensas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoyaltyCard' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/cards/{loyaltyCard}:
    parameters:
      - $ref: '#/components/parameters/LoyaltyCardId'
    get:
      tags: [Negocio]
      summary: Detalle de una tarjeta
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Tarjeta con sus recompensas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoyaltyCard' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Negocio]
      summary: Editar una tarjeta
      description: |
        Todos los campos son opcionales: se actualiza sólo lo que se envía.

        `type` **sólo** puede cambiarse mientras la tarjeta no tenga clientes ni
        recompensas (el progreso acumulado depende del tipo). Al cambiar a
        `spend` se limpia `required_stamps` y, al volver a `visits`, se limpia la
        configuración de puntos.

        Si se envía `period_days` sin `period_type`, el ciclo pasa a `days`.
      security: [{ OAuth2: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 1000, nullable: true }
                type: { $ref: '#/components/schemas/LoyaltyCardType' }
                required_stamps: { type: integer, minimum: 1, maximum: 100, description: 'Sólo tarjetas `visits`.' }
                spend_amount_per_block: { type: number, format: float, minimum: 1, nullable: true, description: 'Sólo tarjetas `spend`.' }
                points_per_block: { type: integer, minimum: 1, maximum: 10000, nullable: true, description: 'Sólo tarjetas `spend`.' }
                currency: { type: string, minLength: 3, maxLength: 3, nullable: true, example: MXN }
                period_type: { $ref: '#/components/schemas/CardPeriodType' }
                period_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
                reward_description: { type: string, maxLength: 180, nullable: true }
                terms: { type: string, maxLength: 2000, nullable: true }
                primary_color: { type: string, nullable: true }
                secondary_color: { type: string, nullable: true }
                text_color: { type: string, nullable: true }
                is_active: { type: boolean }
                is_public: { type: boolean }
                expires_at: { type: string, format: date-time, nullable: true }
                settings: { type: object, additionalProperties: true }
            examples:
              pasarAConsumo:
                summary: Convertir la tarjeta a puntos por consumo
                value:
                  type: spend
                  spend_amount_per_block: 100
                  points_per_block: 10
                  currency: MXN
      responses:
        '200':
          description: Tarjeta actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoyaltyCard' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Negocio]
      summary: Archivar una tarjeta
      security: [{ OAuth2: [] }]
      responses:
        '200':
          description: Tarjeta archivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /api/business/cards/{loyaltyCard}/upload-assets:
    post:
      tags: [Negocio]
      summary: Subir logo, fondo o icono de sello de la tarjeta
      security: [{ OAuth2: [] }]
      parameters:
        - $ref: '#/components/parameters/LoyaltyCardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
