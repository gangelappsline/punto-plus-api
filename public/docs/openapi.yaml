  /api/business/redemptions/complete:
    post:
      tags: [Negocio]
      summary: Validar un canje por código
      description: |
        El negocio teclea o escanea el código `PP-XXXXXXXX` que muestra la app del cliente.
        Marca el canje como `completed`, registra quién lo aprobó y suma la recompensa
        entregada en la tarjeta del cliente.
      security: [{ OAuth2: [negocio, admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: PP-8F3K2L9Q }
      responses:
        '200':
          description: Canje validado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Canje validado. Entrega la recompensa al cliente. }
                  data: { $ref: '#/components/schemas/Redemption' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/redemptions/{redemption}/approve:
    post:
      tags: [Negocio]
      summary: Validar un canje por identificador
      security: [{ OAuth2: [negocio, admin] }]
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '200':
          description: Canje validado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Redemption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/business/redemptions/{redemption}/reject:
    post:
      tags: [Negocio]
      summary: Rechazar un canje (devuelve sellos y stock)
      security: [{ OAuth2: [negocio, admin] }]
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, example: El cliente no se presentó }
      responses:
        '200':
          description: Canje rechazado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Redemption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 de Laravel Passport 13
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            cliente: Tarjetas, sellos, canjes y promociones del cliente autenticado
            negocio: Gestión del negocio (tarjetas, recompensas, promociones, escaneos y canjes)
            admin: Administración global de la plataforma
        password:
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            cliente: Tarjetas, sellos, canjes y promociones del cliente autenticado
            negocio: Gestión del negocio
            admin: Administración global de la plataforma
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PerPage:
      name: per_page
      in: query
      description: Elementos por página (1-100)
      schema: { type: integer, default: 15, minimum: 1, maximum: 100 }
    Page:
      name: page
      in: query
      description: Número de página
      schema: { type: integer, minimum: 1, default: 1 }
    BusinessId:
      name: business
      in: path
      required: true
      schema: { type: string, format: uuid }
    LoyaltyCardId:
      name: loyaltyCard
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerCardId:
      name: customerCard
      in: path
      required: true
      schema: { type: string, format: uuid }
    RewardId:
      name: reward
      in: path
      required: true
      schema: { type: string, format: uuid }
    PromotionId:
      name: promotion
      in: path
      required: true
      schema: { type: string, format: uuid }
    RedemptionId:
      name: redemption
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    AuthSuccess:
      description: Usuario autenticado con tokens OAuth2
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              user: { $ref: '#/components/schemas/User' }
              authorization: { $ref: '#/components/schemas/TokenResponse' }
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Unauthenticated.', error: unauthenticated }
    Forbidden:
      description: Sin permisos (rol, scope o Policy)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            scope:
              value: { message: 'This action requires the following scope(s): negocio.', error: missing_scope, required_scopes: [negocio] }
            policy:
              value: { message: 'Esa tarjeta no pertenece a otro negocio.', error: forbidden }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'No query results for model [App\\Models\\Business].', error: not_found }
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Demasiadas peticiones (throttle)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Too Many Attempts.', error: too_many_requests }
    OAuthNotConfigured:
      description: Falta el cliente OAuth2 o las claves RSA
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: El servidor OAuth2 no está configurado correctamente.
            error: oauth_not_configured
            hint: Ejecuta `php artisan passport:install` y `php artisan punto-plus:oauth-clients --write-env`.

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }

    Error:
      type: object
      properties:
        message: { type: string }
        error: { type: string, description: Código estable del error }
        hint: { type: string, description: Detalle adicional (sólo en errores de configuración) }
        required_scopes:
          type: array
          items: { type: string }
          description: Scopes que faltaban (sólo en `missing_scope`)

    ValidationError:
      type: object
      properties:
        message: { type: string, example: Los datos enviados no son correctos. }
        error: { type: string, example: validation_error }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_grant }
        error_description: { type: string }
        hint: { type: string }
        message: { type: string }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string, nullable: true }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 86400 }
        scope: { type: string, example: cliente }

    Paginated:
      type: object
      properties:
        data: { type: array, items: {} }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Marta Ruiz }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [cliente, negocio, admin] }
        role_label: { type: string, example: Cliente }
        is_active: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        cards_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Café Aurora }
        slug: { type: string, example: cafe-aurora }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true, example: ES }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        logo_url: { type: string, nullable: true }
        background_url: { type: string, nullable: true }
        stamp_icon_url: { type: string, nullable: true }
        card_settings: { type: object, additionalProperties: true }
        is_active: { type: boolean }
        owner: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        loyalty_cards:
          type: array
          items: { $ref: '#/components/schemas/LoyaltyCard' }
        loyalty_cards_count: { type: integer, nullable: true }
        customers_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    LoyaltyCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name: { type: string, example: Club del café }
        slug: { type: string }
        description: { type: string, nullable: true }
        required_stamps: { type: integer, example: 6 }
        reward_description: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        background_url: { type: string, nullable: true }
        stamp_icon_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true }
        secondary_color: { type: string, nullable: true }
        text_color: { type: string, nullable: true }
        join_code: { type: string, example: CAFE2026 }
        join_url: { type: string, format: uri }
        qr: { nullable: true, allOf: [{ $ref: '#/components/schemas/QrCode' }] }
        is_active: { type: boolean }
        is_public: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        settings: { type: object, additionalProperties: true }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        rewards_count: { type: integer, nullable: true }
        customers_count: { type: integer, nullable: true }
        stamps_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Reward:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid }
        name: { type: string, example: Café gratis }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        reward_type: { type: string, enum: [free_product, discount, gift, points, custom] }
        reward_type_label: { type: string }
        value: { type: number, nullable: true }
        required_stamps: { type: integer }
        stock: { type: integer, nullable: true }
        has_stock: { type: boolean }
        is_active: { type: boolean }
        redemptions_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Progress:
      type: object
      properties:
        stamps_count: { type: integer }
        required_stamps: { type: integer }
        stamps_remaining: { type: integer }
        progress_percentage: { type: number, example: 33.33 }
        completed: { type: boolean }

    CustomerCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Código que viaja en el QR del cliente', example: AB12CD34EF }
        user_id: { type: integer }
        loyalty_card_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        stamps_count: { type: integer }
        required_stamps: { type: integer }
        stamps_remaining: { type: integer }
        progress_percentage: { type: number }
        progress: { $ref: '#/components/schemas/Progress' }
        status: { type: string, enum: [active, completed, expired, blocked] }
        status_label: { type: string }
        rewards_earned: { type: integer }
        rewards_redeemed: { type: integer }
        total_stamps_earned: { type: integer }
        completed_at: { type: string, format: date-time, nullable: true }
        last_stamp_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        loyalty_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/LoyaltyCard' }] }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        user: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        stamps:
          type: array
          items: { $ref: '#/components/schemas/Stamp' }
        created_at: { type: string, format: date-time }

    CustomerCardResponse:
      type: object
      properties:
        message: { type: string }
        already_joined: { type: boolean }
        data: { $ref: '#/components/schemas/CustomerCard' }

    Stamp:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_card_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid }
        source: { type: string, enum: [scan, manual, import, adjustment] }
        source_label: { type: string }
        purchase_amount: { type: number, nullable: true, example: 4.5 }
        notes: { type: string, nullable: true }
        stamped_at: { type: string, format: date-time }
        registered_by: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        customer_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/CustomerCard' }] }
        created_at: { type: string, format: date-time }

    Promotion:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        loyalty_card_id: { type: string, format: uuid, nullable: true }
        title: { type: string, example: 2x1 en cafés los martes }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        discount_type: { type: string, enum: [percentage, fixed, gift, points] }
        discount_type_label: { type: string }
        discount_value: { type: number, nullable: true }
        code: { type: string, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        is_active_now: { type: boolean }
        max_redemptions: { type: integer, nullable: true }
        redemptions_count: { type: integer }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        created_at: { type: string, format: date-time }

    Redemption:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PP-8F3K2L9Q }
        status: { type: string, enum: [pending, completed, rejected, cancelled] }
        status_label: { type: string }
        stamps_used: { type: integer }
        redeemed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        customer_card_id: { type: string, format: uuid }
        reward_id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        user_id: { type: integer }
        reward: { nullable: true, allOf: [{ $ref: '#/components/schemas/Reward' }] }
        customer_card: { nullable: true, allOf: [{ $ref: '#/components/schemas/CustomerCard' }] }
        business: { nullable: true, allOf: [{ $ref: '#/components/schemas/Business' }] }
        user: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        approved_by: { nullable: true, allOf: [{ $ref: '#/components/schemas/User' }] }
        created_at: { type: string, format: date-time }

    QrCode:
      type: object
      description: |
        QR generado por el servidor. `payload` es el objeto que la app puede volver
        a codificar sin conexión; `json` es la cadena exacta que viaja dentro del QR
        y `svg` su representación gráfica (null si bacon/bacon-qr-code no está instalado).

        - `loyalty_card.join` (lo escanea el cliente para unirse): `join_code`, `loyalty_card_id`,
          `business_id`, `business` (nombre) y `url`.
        - `customer_card.identify` (lo escanea el negocio para sellar): `code`, `loyalty_card_id`,
          `business_id`, `holder` (nombre del cliente), `stamps` y `required_stamps`.
      properties:
        payload:
          type: object
          description: Contenido estructurado del QR (para regenerarlo en la app)
          properties:
            v: { type: integer, example: 1, description: Versión del formato del payload }
            type: { type: string, enum: [loyalty_card.join, customer_card.identify] }
            join_code: { type: string, nullable: true, description: 'Código de alta del programa (payload loyalty_card.join)' }
            code: { type: string, nullable: true, description: 'Código de la tarjeta del cliente (payload customer_card.identify)' }
            loyalty_card_id: { type: string, format: uuid, nullable: true }
            business_id: { type: string, format: uuid, nullable: true }
            business: { type: string, nullable: true, description: Nombre del negocio (si venía cargado en la petición) }
            holder: { type: string, nullable: true, description: Nombre del cliente titular de la tarjeta }
            stamps: { type: integer, nullable: true, example: 3, description: Sellos acumulados en el momento de generar el QR }
            required_stamps: { type: integer, nullable: true, example: 10 }
            url: { type: string, format: uri, nullable: true, example: 'https://puntoplus.test/join?code=CAFE2026' }
        json: { type: string, description: Cadena JSON exacta que codifica el QR }
        svg: { type: string, nullable: true, description: 'SVG del QR (null si bacon/bacon-qr-code no está instalado)' }

security:
  - Bearer: []
